<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D4D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer logo container: rounded square with gradient, rotated approx 3 degrees -->
  <rect width="40" height="40" rx="12" fill="url(#brandGradient)" transform="rotate(3 20 20)" />

  <!-- Inner container: white, inset approx 2px from outer boundary, rounded corners approx 10px, centered -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#FFFFFF" />

  <!-- Main symbol: pharmacy / medical cross (SVG viewBox: 0 0 24 24) -->
  <svg x="8" y="8" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <!-- Medical Cross / Pharmacy Symbol -->
    <path
      d="M10.5 2V8.5H4V15.5H10.5V22H17.5V15.5H24V8.5H17.5V2H10.5Z"
      fill="url(#brandGradient)"
      opacity="0.9"
    />
    <!-- Flowing Wave inside -->
    <path
      d="M4 12C8 12 10 9 14 9C18 9 20 12 24 12"
      fill="none"
      stroke="white"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</svg>
