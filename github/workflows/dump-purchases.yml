name: dump-purchases
on: workflow_dispatch
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          mkdir -p out
          git rev-parse HEAD > out/SHA.txt
          git ls-files > out/all-files.txt
          git ls-files | grep -Ei "purchase|supplier|invoice|accounting|journal|financialtransaction|fifo|inventory|sync|workflow" > out/targets.txt
          while read -r f; do
            printf '\n\n===== FILE: %s =====\n' "$f" >> out/bundle.txt
            cat "$f" >> out/bundle.txt
          done < out/targets.txt
          wc -l out/bundle.txt
      - uses: actions/upload-artifact@v4
        with: { name: purchases-bundle, path: out/ }
