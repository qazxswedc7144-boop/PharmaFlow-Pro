name: Accounting Journal Identity Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/accounting/services/AccountingEngine.ts'
      - 'server/tests/purchase-lifecycle-financial-integrity.test.ts'
      - 'vitest.phase-c.config.ts'
      - 'server/tests/phase-c-setup.ts'
      - '.github/workflows/accounting-journal-identity.yml'

jobs:
  purchase-journal-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public

      - name: Run focused purchase journal identity regression
        run: >-
          npx vitest run
          --config vitest.phase-c.config.ts
          --reporter=verbose
          server/tests/purchase-lifecycle-financial-integrity.test.ts
          -t "keeps transactionUuid journal identities consistent across purchase, retry, and accounting reversal"
        env:
          NODE_ENV: test
