name: NPM Security Audit

on:
  push:
    branches: [security/fix-npm-vulnerabilities]
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-security-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Run npm audit and preserve full report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const metadata = report.metadata?.vulnerabilities ?? {};
          console.log('NPM_AUDIT_SUMMARY=' + JSON.stringify(metadata));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via
            }));
          }
          NODE
          echo "npm audit exit code: $audit_status"
          exit 0
      - name: Upload complete npm audit JSON
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-baseline
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
