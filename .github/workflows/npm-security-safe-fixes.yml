name: Apply Safe NPM Security Updates

on:
  push:
    branches: [security/fix-npm-vulnerabilities]
    paths:
      - ".github/workflows/npm-security-safe-fixes.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  safe-updates:
    if: "!contains(github.event.head_commit.message, '[npm-security-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve patch and minor dependency updates
        shell: bash
        run: |
          npm update --package-lock-only --ignore-scripts --no-audit axios firebase multer vite zod
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm pkg set 'overrides.@grpc/grpc-js=^1.14.7'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Require zero production dependency vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-production.json', 'utf8'));
          const summary = report.metadata?.vulnerabilities ?? {};
          console.log('PRODUCTION_AUDIT=' + JSON.stringify(summary));
          if ((summary.total ?? 0) !== 0) process.exit(1);
          NODE
      - name: Record full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-full.json
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-full.json', 'utf8'));
          console.log('FULL_AUDIT=' + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            const fix = item.fixAvailable;
            console.log([name, item.severity, item.isDirect ? 'direct' : 'transitive',
              fix === true ? 'semver-safe-fix-available' :
              fix === false ? 'no-fix' :
              fix?.isSemVerMajor ? 'major-required:' + fix.name + '@' + fix.version : 'review-required'
            ].join(' | '));
          }
          NODE
      - name: Clean install
        run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit lockfile and manifest updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): apply non-major npm security updates [npm-security-bot]"
          git push origin HEAD:security/fix-npm-vulnerabilities
