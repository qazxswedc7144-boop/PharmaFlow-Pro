name: Generate Auth Cleanup Prisma Migration

on:
  push:
    branches:
      - security/cleanup-expired-auth-tokens

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch and base history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public

      - name: Generate migration with official Prisma CLI
        run: |
          git fetch origin main
          git show origin/main:prisma/schema.prisma > /tmp/schema-before.prisma
          npx prisma migrate diff \
            --from-schema-datamodel /tmp/schema-before.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/cleanup-auth-tokens.generated.sql

          grep -Fq 'CREATE INDEX "sessions_expiresAt_idx" ON "sessions"("expiresAt")' /tmp/cleanup-auth-tokens.generated.sql
          grep -Fq 'CREATE INDEX "refresh_tokens_expiresAt_idx" ON "refresh_tokens"("expiresAt")' /tmp/cleanup-auth-tokens.generated.sql

          index_count=$(grep -c '^CREATE INDEX ' /tmp/cleanup-auth-tokens.generated.sql)
          test "$index_count" -eq 2

          cp /tmp/cleanup-auth-tokens.generated.sql prisma/migrations/20261116010000_cleanup_expired_auth_tokens/migration.sql

      - name: Commit generated migration when changed
        run: |
          if git diff --quiet -- prisma/migrations/20261116010000_cleanup_expired_auth_tokens/migration.sql; then
            echo "Prisma-generated migration already matches the schema diff."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261116010000_cleanup_expired_auth_tokens/migration.sql
          git commit -m "chore(prisma): regenerate auth cleanup migration with Prisma CLI"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          gh workflow run .github/workflows/run-tests.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
