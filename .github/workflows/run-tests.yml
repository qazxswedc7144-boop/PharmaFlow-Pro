name: Run Tests

on:
  push:
    branches: [ main, fix/tenant-isolation-phase2-hardening, fix/auth-security-phase1, security/business-logic-financial-integrity-phase1 ]
  pull_request:
    branches: [ main, fix/sync-outbox-ownership-phase3 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove stale lock file
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          npm_config_cache: /tmp/.npm-cache

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public

      - name: Run Atomicity, Tenant Isolation, and Sync Lifecycle Tests
        run: >-
          npx vitest run
          server/tests/fifo-tenant-boundary.test.ts
          server/tests/manual-journal-tenant-isolation.test.ts
          server/tests/payment-financial-integrity-atomicity.test.ts
          server/tests/tenant-isolation-phase2.test.ts
          server/tests/password-hash-compatibility.test.ts
          server/tests/sync-security-hardening.test.ts
          server/tests/sync-branch-security-hardening.test.ts
          server/tests/legacy-local-sync-cleanup.test.ts
          server/tests/sync-engine-phase6-e2e.test.ts
          server/tests/jwt-secrets.test.ts
          server/tests/login-attempt-guard.test.ts
          server/tests/sales-server-price-validation.test.ts
          server/tests/sales-pricing.service.test.ts
          src/features/accounting/services/AccountingEngine.sales-tax.test.ts
          src/features/sales/services/localSalesPricing.service.test.ts
          src/features/sales/workflows/SalesWorkflow.local-pricing.test.ts
          src/features/purchases/utils/pendingProducts.test.ts
          server/tests/purchase-integrity-phase2.test.ts
          server/tests/purchase-lifecycle-financial-integrity.test.ts
          src/features/inventory/utils/localSyncQueueForensics.test.ts
          src/features/sync/saleSyncDto.test.ts
          src/features/sync/sync.engine.transactional-enqueue.test.ts
          src/core/workflow/workflowExecution.sales-atomicity.integration.test.ts
          src/core/workflow/workflowExecution.post-commit.test.ts
        env:
          NODE_ENV: test

      - name: TypeScript Typecheck
        if: always()
        run: npm run typecheck

      - name: Production Build
        if: always()
        run: npm run build

  postgres-integration:
    name: PostgreSQL + HTTP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pharmaflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmaflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmaflow_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pharmaflow_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-access-secret-32-characters-minimum
      JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum
      ENCRYPTION_KEY: ci-only-encryption-key-32-characters-minimum

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove stale lock file
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          npm_config_cache: /tmp/.npm-cache

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply repository migrations to isolated PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migrated schema
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(`
              SELECT
                (SELECT COUNT(*) FROM information_schema.tables
                 WHERE table_schema = 'public' AND table_type = 'BASE TABLE')::int AS table_count,
                (SELECT COUNT(*) FROM pg_type t
                 JOIN pg_namespace n ON n.oid = t.typnamespace
                 WHERE n.nspname = 'public' AND t.typtype = 'e')::int AS enum_count,
                (SELECT COUNT(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL)::int AS applied_migrations
            `);
            console.log("PostgreSQL migration verification:", JSON.stringify(rows[0]));
            if (rows[0].table_count < 40 || rows[0].enum_count < 10 || rows[0].applied_migrations < 1) {
              throw new Error("Migrated schema is incomplete.");
            }
          } finally {
            await client.end();
          }
          NODE

      - name: Run PostgreSQL HTTP Authentication integration tests
        run: npx vitest run server/tests/auth.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run PostgreSQL HTTP Sync integration tests
        if: always()
        run: npx vitest run server/tests/sync.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run PostgreSQL HTTP Tenant Isolation + Invoice integration tests
        if: always()
        run: npx vitest run server/tests/invoice-isolation.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"
