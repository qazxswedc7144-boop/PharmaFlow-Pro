name: Run Tests

on:
  push:
    branches: [ main, fix/tenant-isolation-phase2-hardening, fix/auth-security-phase1, security/business-logic-financial-integrity-phase1 ]
  pull_request:
    branches: [ main, fix/sync-outbox-ownership-phase3 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove stale lock file
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          npm_config_cache: /tmp/.npm-cache

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Atomicity, Tenant Isolation, and Sync Lifecycle Tests
        run: >-
          npx vitest run
          server/tests/fifo-tenant-boundary.test.ts
          server/tests/manual-journal-tenant-isolation.test.ts
          server/tests/payment-financial-integrity-atomicity.test.ts
          server/tests/tenant-isolation-phase2.test.ts
          server/tests/password-hash-compatibility.test.ts
          server/tests/sync-security-hardening.test.ts
          server/tests/sync-branch-security-hardening.test.ts
          server/tests/legacy-local-sync-cleanup.test.ts
          server/tests/sync-engine-phase6-e2e.test.ts
          server/tests/jwt-secrets.test.ts
          server/tests/login-attempt-guard.test.ts
          server/tests/sales-server-price-validation.test.ts
          server/tests/sales-policy-tenant-isolation.test.ts
        env:
          NODE_ENV: test

      - name: TypeScript Typecheck
        if: always()
        run: npm run typecheck

      - name: Production Build
        if: always()
        run: npm run build
