name: Run Tests

concurrency:
  group: run-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, fix/tenant-isolation-phase2-hardening, fix/auth-security-phase1, security/business-logic-financial-integrity-phase1, fix/sales-save-performance-idempotency, fix/sales-save-failure-state, phase-c/omitted-test-execution ]
  pull_request:
    branches: [ main, fix/sync-outbox-ownership-phase3 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove stale lock file
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          npm_config_cache: /tmp/.npm-cache

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public

      - name: Run Atomicity, Tenant Isolation, and Sync Lifecycle Tests
        run: >-
          npx vitest run --reporter=verbose
          server/tests/fifo-tenant-boundary.test.ts
          server/tests/fifo-cost-chain.test.ts
          server/tests/manual-journal-tenant-isolation.test.ts
          server/tests/payment-financial-integrity-atomicity.test.ts
          server/tests/voucher-cancellation-hardening.test.ts
          server/tests/voucher-sync-dispatch.test.ts
          server/tests/tenant-isolation-phase2.test.ts
          server/tests/tenant-isolation-hardening.test.ts
          server/tests/password-hash-compatibility.test.ts
          server/tests/sync-security-hardening.test.ts
          server/tests/sync-branch-security-hardening.test.ts
          server/tests/legacy-local-sync-cleanup.test.ts
          server/tests/sync-engine-phase6-e2e.test.ts
          server/tests/jwt-secrets.test.ts
          server/tests/login-attempt-guard.test.ts
          server/tests/middleware-fail-closed.test.ts
          server/tests/sales-server-price-validation.test.ts
          server/tests/sales-pricing.service.test.ts
          src/features/accounting/services/AccountingEngine.sales-tax.test.ts
          src/features/sales/services/localSalesPricing.service.test.ts
          src/features/sales/workflows/SalesWorkflow.local-pricing.test.ts
          src/features/purchases/utils/pendingProducts.test.ts
          src/features/purchases/utils/recoverablePurchaseDraft.test.ts
          src/features/sales/components/productRegistrationError.test.ts
          src/features/sales/components/productLookup.test.ts
          src/features/sales/hooks/useSales.save-failure.test.ts
          src/features/sales/utils/saleStockAvailability.test.ts
          src/database/repositories/invoice.repository.p2.test.ts
          src/database/repositories/SupplierRepository.payment-history.test.ts
          src/services/reports/reportEngine.refresh.test.ts
          src/services/integrity/periodService.test.ts
          src/features/accounting/services/AccountingPeriodSyncService.test.ts
          src/services/transactions/PeriodLockEngine.test.ts
          src/features/catalog/workflows/ProductApplicationWorkflow.test.ts
          src/features/purchases/workflows/PurchaseWorkflow.sync.test.ts
          src/features/purchases/workflows/PurchaseWorkflow.numbering.test.ts
          src/core/workflow/syncContract.test.ts
          src/core/workflow/workflowContext.test.ts
          src/core/integrity/executionGuard.local.test.ts
          src/features/branches/services/activeBranchRegistry.test.ts
          src/core/workflow/workflowContext.branch.test.ts
          src/features/inventory/utils/projectedAutocompleteStock.test.ts
          src/features/purchases/utils/failedPurchaseDraft.test.ts
          src/features/purchases/utils/cleanupFailedPurchaseOperation.test.ts
          src/core/integrity/idempotencyRegistry.persistence.test.ts
          src/services/system/DraftService.test.ts
          src/services/system/diagnosticLogger.test.ts
          src/features/purchases/utils/purchaseFailureDisposition.test.ts
          src/features/purchases/utils/purchaseSaveFailure.test.ts
          src/features/inventory/utils/newPurchaseProduct.test.ts
          server/tests/purchase-integrity-phase2.test.ts
          server/tests/atomic-post-sale-price-policy.test.ts
          server/tests/post-sale-tenant-isolation.test.ts
          server/tests/sales-lifecycle-financial-integrity.test.ts
          server/tests/payment-idempotency-tenant-isolation.test.ts
          server/tests/financial-transaction-sales-price-policy.test.ts
          src/features/sales/utils/archiveDateFilters.test.ts
          src/features/inventory/utils/localSyncQueueForensics.test.ts
          src/features/sales/components/itemEntryModalLifecycle.test.ts
          src/features/sync/saleSyncDto.test.ts
          src/features/sync/sync.engine.transactional-enqueue.test.ts
          src/core/workflow/workflowExecution.sales-atomicity.integration.test.ts
          src/core/workflow/workflowExecution.post-commit.test.ts
          src/features/inventory/services/phase0a-fifo-expiry-safety.test.ts
          src/features/inventory/workflows/__tests__/InventoryAdjustmentWorkflow.failure-injection.test.ts
          server/tests/inventory-move-expiry-safety.test.ts
        env:
          NODE_ENV: test

      - name: TypeScript Typecheck
        if: always()
        run: npm run typecheck

      - name: Production Build
        if: always()
        run: npm run build

  postgres-integration:
    name: PostgreSQL + HTTP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pharmaflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmaflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmaflow_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pharmaflow_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-access-secret-32-characters-minimum
      JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum
      ENCRYPTION_KEY: ci-only-encryption-key-32-characters-minimum

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove stale lock file
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          npm_config_cache: /tmp/.npm-cache

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply repository migrations to isolated PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migrated schema
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const { rows } = await client.query(`
              SELECT
                (SELECT COUNT(*) FROM information_schema.tables
                 WHERE table_schema = 'public' AND table_type = 'BASE TABLE')::int AS table_count,
                (SELECT COUNT(*) FROM pg_type t
                 JOIN pg_namespace n ON n.oid = t.typnamespace
                 WHERE n.nspname = 'public' AND t.typtype = 'e')::int AS enum_count,
                (SELECT COUNT(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL)::int AS applied_migrations
            `);
            console.log("PostgreSQL migration verification:", JSON.stringify(rows[0]));
            if (rows[0].table_count < 40 || rows[0].enum_count < 10 || rows[0].applied_migrations < 1) {
              throw new Error("Migrated schema is incomplete.");
            }
          } finally {
            await client.end();
          }
          NODE

      - name: Run PostgreSQL HTTP Authentication integration tests
        run: npx vitest run server/tests/auth.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run PostgreSQL HTTP Auth Register security integration tests
        run: npx vitest run server/tests/auth-register-security.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run PostgreSQL HTTP Sync integration tests
        if: always()
        run: npx vitest run server/tests/sync.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run PostgreSQL HTTP Tenant Isolation + Invoice integration tests
        if: always()
        run: npx vitest run server/tests/invoice-isolation.integration.test.ts --reporter=verbose --maxWorkers=1

      # Phase 3 reconciliation suite — isolated PostgreSQL test database only.
      - name: Run PostgreSQL Phase 3 Financial Reconciliation tests
        if: always()
        run: npx vitest run server/tests/financial-reconciliation.phase3.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      # Phase 4A FIFO provenance suite — isolated PostgreSQL test database only.
      - name: Run PostgreSQL Phase 4A FIFO Layer Cost Provenance tests
        if: always()
        run: npx vitest run server/tests/fifo-layer-cost-provenance.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      # Phase 4B payment allocation and voucher reversal suite — isolated PostgreSQL only.
      - name: Run PostgreSQL Phase 4B Voucher Allocation Posting tests
        if: always()
        run: npx vitest run server/tests/voucher-allocation-posting.integration.test.ts --reporter=verbose --maxWorkers=1
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

  phase-c-omitted-tests:
    name: Phase C - 17 previously omitted test files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/pharmaflow_ci?schema=public
      JWT_SECRET: ci-only-access-secret-32-characters-minimum
      JWT_REFRESH_SECRET: ci-only-refresh-secret-32-characters-minimum
      ENCRYPTION_KEY: ci-only-encryption-key-32-characters-minimum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Execute all 17 omitted test files independently
        shell: bash
        run: |
          set +e
          mkdir -p phase-c-logs
          failed=0
          : > phase-c-logs/summary.txt
          TEST_FILES=(
            app/applet/server/tests/security-patch-2.test.ts
            server/tests/idempotency-middleware-security.test.ts
            server/tests/p0-hotfix-inventory-isolation.test.ts
            server/tests/p0-hotfix-metrics-backup.test.ts
            server/tests/p0-hotfix-validation-fifo-isolation.test.ts
            server/tests/prisma-recovery.test.ts
            server/tests/purchase-lifecycle-financial-integrity.test.ts
            server/tests/purchase-phase1-contract-integrity.test.ts
            server/tests/purchase-phase2-accounting-integrity.test.ts
            server/tests/purchase-phase2-reversal-precision.test.ts
            server/tests/purchase-total-enforcement.test.ts
            server/tests/supplier-payment-financial-integrity.test.ts
            server/tests/sync-cross-tenant-security.test.ts
            src/features/catalog/utils/productApplicationPermission.test.ts
            src/features/inventory/services/UnifiedInventoryMutationEngine.purchase-transaction.test.ts
            src/features/inventory/services/fifoEngine.transactional.test.ts
            src/features/sales/services/salesDraftRecovery.service.test.ts
          )

          for file in "${TEST_FILES[@]}"; do
            safe_name="${file//\//__}"
            log="phase-c-logs/${safe_name}.log"
            echo "===== START: $file ====="
            npx vitest run --config vitest.phase-c.config.ts --reporter=verbose --maxWorkers=1 "$file" 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              result="PASS"
            else
              result="FAIL (exit $status)"
              failed=$((failed + 1))
            fi
            echo "$result | $file" | tee -a phase-c-logs/summary.txt
            echo "===== END: $file | $result ====="
          done

          echo "Failed files: $failed / ${#TEST_FILES[@]}" | tee -a phase-c-logs/summary.txt
          exit "$failed"

      - name: Upload Phase C per-file logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-c-omitted-test-logs
          path: phase-c-logs/
          if-no-files-found: warn
