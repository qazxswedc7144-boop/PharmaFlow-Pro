name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Atomicity Tests
        run: npx vitest run server/tests/payment-financial-integrity-atomicity.test.ts
        env:
          NODE_ENV: test
