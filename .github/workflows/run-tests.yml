name: Run Tests

on:
  push:
    branches: [ main, fix/tenant-isolation-phase2-hardening ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove stale lock file
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
        env:
          npm_config_cache: /tmp/.npm-cache

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Atomicity and Tenant Isolation Tests
        run: npx vitest run server/tests/payment-financial-integrity-atomicity.test.ts server/tests/tenant-isolation-phase2.test.ts server/tests/password-hash-compatibility.test.ts server/tests/sync-security-hardening.test.ts server/tests/sync-branch-security-hardening.test.ts
        env:
          NODE_ENV: test

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Build
        run: npm run build
