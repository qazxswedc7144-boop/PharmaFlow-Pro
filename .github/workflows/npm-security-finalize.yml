name: Finalize NPM Safe Lockfile Updates

on:
  push:
    branches: [security/fix-npm-vulnerabilities]
    paths:
      - ".github/workflows/npm-security-finalize.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[npm-security-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from reviewed overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          status=$?
          set -e
          node -e "const r=require('./npm-audit-production.json'); const s=r.metadata?.vulnerabilities ?? {}; console.log(JSON.stringify(s)); if ((s.total ?? 0)!==0) process.exit(1)"
      - name: Clean install and validate
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit reviewed dependency files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git commit -m "fix(deps): update patched lockfile packages [npm-security-bot]"
          git push origin HEAD:security/fix-npm-vulnerabilities
